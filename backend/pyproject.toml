[project]
name = "compre-barato-alagoas-backend"
version = "0.1.0"
description = "Backend for Compre Barato Alagoas — secure intermediary over the SEFAZ-AL Economiza Alagoas public price API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # Redis is a mandatory dependency (cache, shareable lists, device records).
    "redis>=5.0",
]

[project.optional-dependencies]
# Real external integrations. Not needed to run/test in mock mode.
prod = [
    "gunicorn>=22.0",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentry-sdk>=2.0",
    "langfuse>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # In-process Redis so tests exercise the real Redis code paths, no server.
    "fakeredis>=2.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
