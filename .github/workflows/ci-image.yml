# Publish the CI toolchain image to GHCR — ONLY when the recipe changes.
# Normal PR/deploy workflows must only PULL this image (see deploy.yml job.container).
# Pattern: docs.github.com/actions/using-jobs/running-jobs-in-a-container + GHCR publish.
name: Build CI e2e image

on:
  push:
    branches: [main]
    paths:
      - 'e2e/Dockerfile.ci'
      - 'e2e/package.json'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:
  # Security/base OS updates without waiting for a Dockerfile edit.
  schedule:
    - cron: '17 4 * * 1'  # weekly Monday

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-publish
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names (org on GitHub may be mixed-case).
      - name: Image name (lowercase)
        id: img
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/compre-barato-alagoas/ci-e2e" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push (infrequent — recipe/schedule only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: e2e/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ci-e2e-publish
          cache-to: type=gha,mode=max,scope=ci-e2e-publish
