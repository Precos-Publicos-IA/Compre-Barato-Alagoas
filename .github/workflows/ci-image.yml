name: Build CI e2e image

# Publishes a pre-baked toolchain (Python/FastAPI/fakeredis, Node, Puppeteer/Chrome)
# so deploy.yml e2e jobs only checkout + run — never reinstall on every PR.
#
# Run once via Actions → "Build CI e2e image" → Run workflow (or merge to main when
# Dockerfile/package.json change). Image must exist before e2e-local can pull it.
on:
  push:
    branches: [main]
    paths:
      - 'e2e/Dockerfile.ci'
      - 'e2e/package.json'
      - '.github/workflows/ci-image.yml'
  # Also allow building from PR branches so the first PR can bootstrap GHCR.
  pull_request:
    paths:
      - 'e2e/Dockerfile.ci'
      - 'e2e/package.json'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/compre-barato-alagoas/ci-e2e

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs push a :pr-<n> tag (no :latest) so main keeps a stable gate image.
      # Main / workflow_dispatch updates :latest used by deploy.yml.
      - name: Docker meta
        id: meta
        run: |
          set -euo pipefail
          tags="${IMAGE}:${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tags="${tags}"$'\n'"${IMAGE}:pr-${{ github.event.pull_request.number }}"
          else
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags:" && echo "$tags"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hint for deploy.yml on first PR
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::Pushed ${IMAGE}:pr-${{ github.event.pull_request.number }}. Until :latest exists on main, set CI_E2E_IMAGE override or merge ci-image first."
