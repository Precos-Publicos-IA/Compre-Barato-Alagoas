name: CI/CD — test, build & deploy to VPS

# Path-filtered deploy to VPS on main. Headless gate uses a **pre-baked image**
# (e2e/Dockerfile.ci): Python/FastAPI/fakeredis + Node + Puppeteer/Chrome are NOT
# installed on the runner each time. We pull GHCR :latest when present, else build
# with Buildx GHA cache (recipe changes only re-run heavy layers).
#
# Optional publish of :latest: workflow "Build CI e2e image" (ci-image.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'shared-assets/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'shared-assets/**'
  workflow_dispatch:

env:
  CI_E2E_IMAGE: ghcr.io/${{ github.repository_owner }}/compre-barato-alagoas/ci-e2e:latest
  CI_E2E_LOCAL: ci-e2e:local

concurrency:
  group: deploy-vps-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.f.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      admin: ${{ steps.f.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.f.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
      deploycfg: ${{ steps.f.outputs.deploycfg == 'true' || github.event_name == 'workflow_dispatch' }}
      e2e: ${{ steps.f.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' }}
      deployable: ${{ steps.f.outputs.backend == 'true' || steps.f.outputs.frontend == 'true' || steps.f.outputs.admin == 'true' || steps.f.outputs.docs == 'true' || steps.f.outputs.deploycfg == 'true' || github.event_name == 'workflow_dispatch' }}
      needs_e2e: ${{ steps.f.outputs.backend == 'true' || steps.f.outputs.frontend == 'true' || steps.f.outputs.admin == 'true' || steps.f.outputs.docs == 'true' || steps.f.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-frontend/**'
            docs:
              - 'docs/**'
            e2e:
              - 'e2e/**'
              - 'AGENTS.md'
              - '.github/workflows/ci-image.yml'
            deploycfg:
              - 'deploy/**'
              - '.env.example'
              - '.github/workflows/deploy.yml'

  # ---- Shared: resolve ci-e2e image (pull GHCR or build once with layer cache). ----
  ci-image:
    needs: changes
    if: needs.changes.outputs.needs_e2e == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Try GHCR latest, else build with cache
        id: tag
        env:
          GHCR: ${{ env.CI_E2E_IMAGE }}
          LOCAL: ${{ env.CI_E2E_LOCAL }}
        run: |
          set -euo pipefail
          if docker pull "$GHCR" 2>/dev/null; then
            docker tag "$GHCR" "$LOCAL"
            echo "Using pre-published $GHCR"
          else
            echo "GHCR miss — building $LOCAL (Buildx cache; not a host apt/npm install)"
            docker buildx build \
              --file e2e/Dockerfile.ci \
              --tag "$LOCAL" \
              --cache-from type=gha,scope=ci-e2e \
              --cache-to type=gha,mode=max,scope=ci-e2e \
              --load \
              .
          fi
          echo "tag=$LOCAL" >> "$GITHUB_OUTPUT"
      - name: Export image for sibling jobs
        run: docker save "${{ env.CI_E2E_LOCAL }}" | gzip > /tmp/ci-e2e.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-e2e-image
          path: /tmp/ci-e2e.tar.gz
          retention-days: 1

  test:
    needs: [changes, ci-image]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-e2e-image
          path: /tmp
      - name: Load ci-e2e image & pytest inside it
        run: |
          set -euo pipefail
          gunzip -c /tmp/ci-e2e.tar.gz | docker load
          docker run --rm \
            -v "$PWD:/work" -w /work/backend \
            "${{ env.CI_E2E_LOCAL }}" \
            bash -lc 'pip3 install --break-system-packages -q -e ".[dev]" && pytest'

  e2e-local:
    needs: [changes, ci-image]
    if: needs.changes.outputs.needs_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-e2e-image
          path: /tmp
      - name: Load image & run full headless suite (no host installs)
        env:
          ADMIN_TOKEN: test-admin-token-0123456789
        run: |
          set -euo pipefail
          gunzip -c /tmp/ci-e2e.tar.gz | docker load
          docker run --rm --user root \
            -e ADMIN_TOKEN \
            -e NODE_PATH=/opt/ci/e2e/node_modules \
            -v "$PWD:/work" -w /work \
            "${{ env.CI_E2E_LOCAL }}" \
            bash e2e/run_local.sh
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-local
          path: e2e/screenshots/
          if-no-files-found: ignore

  deploy:
    needs: [changes, test, e2e-local]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployable == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.e2e-local.result == 'success' || needs.e2e-local.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      API_IMAGE: compre-barato-alagoas-api:${{ github.sha }}
      DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4

      - if: needs.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: |
            ${{ env.API_IMAGE }}
            compre-barato-alagoas-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: needs.changes.outputs.frontend == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Flutter web + APK
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL="https://${DOMAIN}"
          flutter build apk --release --dart-define=API_BASE_URL="https://${DOMAIN}"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship changed parts to the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CH_BACKEND: ${{ needs.changes.outputs.backend }}
          CH_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CH_ADMIN: ${{ needs.changes.outputs.admin }}
          CH_DOCS: ${{ needs.changes.outputs.docs }}
          CH_DEPLOYCFG: ${{ needs.changes.outputs.deploycfg }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key"
          H="$DEPLOY_HOST"
          $SSH "$H" "mkdir -p '$DEPLOY_DIR/web/app' '$DEPLOY_DIR/admin' '$DEPLOY_DIR/docs'"

          avail_mb=$(( $($SSH "$H" "df -Pk '$DEPLOY_DIR' | awk 'NR==2{print \$4}'") / 1024 ))
          echo "==> Free disk on VPS: ${avail_mb}MB"
          if [ "$avail_mb" -lt 2048 ]; then
            echo "ABORT: <2GB free on the VPS; not deploying." >&2; exit 1
          fi

          restart=false
          image_tag=""

          if [ "$CH_BACKEND" = "true" ] || [ "$CH_DEPLOYCFG" = "true" ]; then
            echo "==> Sync deploy/ (compose + remote-update.sh) and .env.example"
            rsync -az --delete -e "$SSH" --exclude '.env' deploy "$H:$DEPLOY_DIR/"
            rsync -az -e "$SSH" .env.example "$H:$DEPLOY_DIR/.env.example"
            restart=true
          fi

          if [ "$CH_BACKEND" = "true" ]; then
            echo "==> Backend changed → load freshly built image onto the host"
            docker save "$API_IMAGE" | gzip | $SSH "$H" "gunzip | docker load"
            image_tag="$API_IMAGE"
          elif [ "$CH_DEPLOYCFG" = "true" ]; then
            echo "==> Deploy config changed → restart with the image already running"
            image_tag="$($SSH "$H" "docker inspect --format '{{.Config.Image}}' deploy-api-1")"
          fi

          if [ "$CH_FRONTEND" = "true" ]; then
            echo "==> Frontend changed → sync web bundle + APK"
            rsync -az --delete -e "$SSH" --exclude 'app/' \
              frontend/build/web/ "$H:$DEPLOY_DIR/web/"
            rsync -az -e "$SSH" \
              frontend/build/app/outputs/flutter-apk/app-release.apk \
              "$H:$DEPLOY_DIR/web/app/compre-barato-alagoas.apk"
          fi

          if [ "$CH_ADMIN" = "true" ]; then
            echo "==> Admin dashboard changed → sync"
            rsync -az --delete -e "$SSH" admin-frontend/ "$H:$DEPLOY_DIR/admin/"
          fi

          if [ "$CH_DOCS" = "true" ]; then
            echo "==> Docs changed → sync (static only; no app redeploy)"
            rsync -az --delete -e "$SSH" docs/ "$H:$DEPLOY_DIR/docs/"
          fi

          if [ "$restart" = "true" ]; then
            echo "==> Restart stack via remote-update.sh (disk pre-check + health check)"
            $SSH "$H" "API_IMAGE='$image_tag' DEPLOY_DIR='$DEPLOY_DIR' bash '$DEPLOY_DIR/deploy/remote-update.sh'"
          else
            echo "==> Static-only change → no stack restart needed."
          fi

  live-verify:
    needs: [changes, deploy, ci-image]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy.result == 'success' &&
      (needs.ci-image.result == 'success' || needs.ci-image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.ci-image.result == 'success'
        with:
          name: ci-e2e-image
          path: /tmp
      - name: Ensure image (reuse artifact or pull/build)
        if: needs.ci-image.result != 'success'
        run: |
          set -euo pipefail
          if ! docker pull "${{ env.CI_E2E_IMAGE }}" 2>/dev/null; then
            docker buildx build -f e2e/Dockerfile.ci -t "${{ env.CI_E2E_LOCAL }}" \
              --cache-from type=gha,scope=ci-e2e --load .
          else
            docker tag "${{ env.CI_E2E_IMAGE }}" "${{ env.CI_E2E_LOCAL }}"
          fi
      - name: Load artifact image
        if: needs.ci-image.result == 'success'
        run: gunzip -c /tmp/ci-e2e.tar.gz | docker load
      - name: Live headless suite inside ci-e2e image
        env:
          APP_URL: https://${{ secrets.DEPLOY_DOMAIN }}
          API_URL: https://${{ secrets.DEPLOY_DOMAIN }}
          DOCS_URL: https://docs.${{ secrets.DEPLOY_DOMAIN }}
          LIVE_ADMIN_URL: https://admin.${{ secrets.DEPLOY_DOMAIN }}
          LIVE_ADMIN_TOKEN: ${{ secrets.LIVE_ADMIN_TOKEN }}
        run: |
          docker run --rm --user root \
            -e NODE_PATH=/opt/ci/e2e/node_modules \
            -e APP_URL -e API_URL -e DOCS_URL -e LIVE_ADMIN_URL -e LIVE_ADMIN_TOKEN \
            -v "$PWD:/work" -w /work \
            "${{ env.CI_E2E_LOCAL }}" \
            node e2e/live.js
      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-live
          path: e2e/screenshots/
          if-no-files-found: ignore
      - name: Phone / integration_test reminder
        run: |
          echo "::notice::On-device Flutter integration_test against live API is required (AGENTS.md §6)."
