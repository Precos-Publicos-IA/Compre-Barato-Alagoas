name: CI/CD — test, build & deploy to VPS

# Auto-deploys pushes to main, but only does the work that the change actually
# needs: backend code → rebuild image + restart; frontend → rebuild Flutter;
# admin/docs → just sync the static files. Pure README/LICENSE changes don't
# even start the pipeline. Forks/PRs never get the deploy secrets (GitHub only
# exposes them to workflows running from the base repo on push).
#
# Headless routine (AGENTS.md):
#   • e2e-local  — PR/push gate when app surfaces or e2e harness change (mock stack)
#   • live-verify — after successful deploy on main (production URLs)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'shared-assets/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'shared-assets/**'
  workflow_dispatch: # manual run forces a full deploy (handy for rollback/redeploy)

# Never let two deploys race on the single shared host.
concurrency:
  group: deploy-vps-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- Work out what actually changed. workflow_dispatch forces everything. ----
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.f.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      admin: ${{ steps.f.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.f.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
      deploycfg: ${{ steps.f.outputs.deploycfg == 'true' || github.event_name == 'workflow_dispatch' }}
      e2e: ${{ steps.f.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' }}
      deployable: ${{ steps.f.outputs.backend == 'true' || steps.f.outputs.frontend == 'true' || steps.f.outputs.admin == 'true' || steps.f.outputs.docs == 'true' || steps.f.outputs.deploycfg == 'true' || github.event_name == 'workflow_dispatch' }}
      needs_e2e: ${{ steps.f.outputs.backend == 'true' || steps.f.outputs.frontend == 'true' || steps.f.outputs.admin == 'true' || steps.f.outputs.docs == 'true' || steps.f.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-frontend/**'
            docs:
              - 'docs/**'
            e2e:
              - 'e2e/**'
              - 'AGENTS.md'
            deploycfg:
              - 'deploy/**'
              - '.env.example'
              - '.github/workflows/deploy.yml'

  # ---- Gate: backend tests, only when backend code changed. ----
  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (test deps; mock mode needs no prod integrations)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run backend tests
        working-directory: backend
        run: pytest

  # ---- Headless full suite on a mock stack (PR + main; efficient path filter). ----
  e2e-local:
    needs: changes
    if: needs.changes.outputs.needs_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend mock deps (for run_local.py)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Install e2e + Chrome for Puppeteer
        working-directory: e2e
        run: |
          npm install
          npx puppeteer browsers install chrome
      - name: Full headless suite (admin + docs + API journeys)
        working-directory: e2e
        env:
          ADMIN_TOKEN: test-admin-token-0123456789
        run: npm run full:local
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-local
          path: e2e/screenshots/
          if-no-files-found: ignore

  # ---- Build only what changed, then ship over SSH (main only). ----
  deploy:
    needs: [changes, test, e2e-local]
    # Run when there's something deployable AND (tests passed OR weren't needed).
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployable == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.e2e-local.result == 'success' || needs.e2e-local.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      API_IMAGE: compre-barato-alagoas-api:${{ github.sha }}
      DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4

      # --- Backend image: only when backend changed (build off the host). ---
      - if: needs.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: |
            ${{ env.API_IMAGE }}
            compre-barato-alagoas-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Flutter web + APK: only when the frontend changed. ---
      - if: needs.changes.outputs.frontend == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Flutter web + APK
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL="https://${DOMAIN}"
          flutter build apk --release --dart-define=API_BASE_URL="https://${DOMAIN}"

      # --- SSH setup (host details come only from secrets). ---
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship changed parts to the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CH_BACKEND: ${{ needs.changes.outputs.backend }}
          CH_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CH_ADMIN: ${{ needs.changes.outputs.admin }}
          CH_DOCS: ${{ needs.changes.outputs.docs }}
          CH_DEPLOYCFG: ${{ needs.changes.outputs.deploycfg }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key"
          H="$DEPLOY_HOST"
          $SSH "$H" "mkdir -p '$DEPLOY_DIR/web/app' '$DEPLOY_DIR/admin' '$DEPLOY_DIR/docs'"

          # Disk pre-check before touching anything (protects the shared host).
          avail_mb=$(( $($SSH "$H" "df -Pk '$DEPLOY_DIR' | awk 'NR==2{print \$4}'") / 1024 ))
          echo "==> Free disk on VPS: ${avail_mb}MB"
          if [ "$avail_mb" -lt 2048 ]; then
            echo "ABORT: <2GB free on the VPS; not deploying." >&2; exit 1
          fi

          restart=false
          image_tag=""

          if [ "$CH_BACKEND" = "true" ] || [ "$CH_DEPLOYCFG" = "true" ]; then
            echo "==> Sync deploy/ (compose + remote-update.sh) and .env.example"
            rsync -az --delete -e "$SSH" --exclude '.env' deploy "$H:$DEPLOY_DIR/"
            rsync -az -e "$SSH" .env.example "$H:$DEPLOY_DIR/.env.example"
            restart=true
          fi

          if [ "$CH_BACKEND" = "true" ]; then
            echo "==> Backend changed → load freshly built image onto the host"
            docker save "$API_IMAGE" | gzip | $SSH "$H" "gunzip | docker load"
            image_tag="$API_IMAGE"
          elif [ "$CH_DEPLOYCFG" = "true" ]; then
            echo "==> Deploy config changed → restart with the image already running"
            image_tag="$($SSH "$H" "docker inspect --format '{{.Config.Image}}' deploy-api-1")"
          fi

          if [ "$CH_FRONTEND" = "true" ]; then
            echo "==> Frontend changed → sync web bundle + APK"
            rsync -az --delete -e "$SSH" --exclude 'app/' \
              frontend/build/web/ "$H:$DEPLOY_DIR/web/"
            rsync -az -e "$SSH" \
              frontend/build/app/outputs/flutter-apk/app-release.apk \
              "$H:$DEPLOY_DIR/web/app/compre-barato-alagoas.apk"
          fi

          if [ "$CH_ADMIN" = "true" ]; then
            echo "==> Admin dashboard changed → sync"
            rsync -az --delete -e "$SSH" admin-frontend/ "$H:$DEPLOY_DIR/admin/"
          fi

          if [ "$CH_DOCS" = "true" ]; then
            echo "==> Docs changed → sync (static only; no app redeploy)"
            rsync -az --delete -e "$SSH" docs/ "$H:$DEPLOY_DIR/docs/"
          fi

          if [ "$restart" = "true" ]; then
            echo "==> Restart stack via remote-update.sh (disk pre-check + health check)"
            $SSH "$H" "API_IMAGE='$image_tag' DEPLOY_DIR='$DEPLOY_DIR' bash '$DEPLOY_DIR/deploy/remote-update.sh'"
          else
            echo "==> Static-only change → no stack restart needed."
          fi

  # ---- After deploy: same philosophy against live hosts (main only). ----
  live-verify:
    needs: [changes, deploy]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install e2e + Chrome
        working-directory: e2e
        run: |
          npm install
          npx puppeteer browsers install chrome
      - name: Live headless suite (app + API + docs)
        working-directory: e2e
        env:
          APP_URL: https://${{ secrets.DEPLOY_DOMAIN }}
          API_URL: https://${{ secrets.DEPLOY_DOMAIN }}
          DOCS_URL: https://docs.${{ secrets.DEPLOY_DOMAIN }}
          LIVE_ADMIN_URL: https://admin.${{ secrets.DEPLOY_DOMAIN }}
          # Optional: set repo secret LIVE_ADMIN_TOKEN to exercise admin login on prod
          LIVE_ADMIN_TOKEN: ${{ secrets.LIVE_ADMIN_TOKEN }}
        run: npm run live
      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-live
          path: e2e/screenshots/
          if-no-files-found: ignore
      - name: Phone / integration_test reminder
        run: |
          echo "::notice::On-device Flutter integration_test against live API is required for full delivery (AGENTS.md §6)."
          echo "Example: cd frontend && flutter test integration_test/app_test.dart \\"
          echo "  --dart-define=API_BASE_URL=https://${{ secrets.DEPLOY_DOMAIN }} -d <device>"
