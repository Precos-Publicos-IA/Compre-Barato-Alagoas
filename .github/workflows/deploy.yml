name: CI/CD — test, build & deploy to VPS

# Auto-deploys every push to main. Forks/PRs never get the deploy secrets
# (GitHub only exposes them to workflows running from the base repo on push).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race on the single shared host.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # ---- Gate 1: backend tests must pass before anything ships. ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (test deps; mock mode needs no prod integrations)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run backend tests
        working-directory: backend
        run: pytest

  # ---- Build the lean image + Flutter artifacts, then ship over SSH. ----
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      API_IMAGE: compre-barato-alagoas-api:${{ github.sha }}
      DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4

      # --- Build the production image (multi-stage; build happens here, never
      #     on the disk-constrained host). ---
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: |
            ${{ env.API_IMAGE }}
            compre-barato-alagoas-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build the Flutter web bundle + release APK (static, served by nginx). ---
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Flutter web + APK
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL="https://${DOMAIN}"
          flutter build apk --release --dart-define=API_BASE_URL="https://${DOMAIN}"

      # --- SSH setup (all host details come from secrets; nothing host-specific
      #     is committed in this public repo). ---
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship build to the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key"
          RSH="$SSH"

          echo "==> Ensure remote dirs"
          $SSH "$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR/web/app' '$DEPLOY_DIR/admin' '$DEPLOY_DIR/docs'"

          echo "==> Sync deploy/ (compose + remote-update.sh + nginx refs) and .env.example"
          rsync -az --delete -e "$RSH" \
            --exclude '.env' \
            deploy "$DEPLOY_HOST:$DEPLOY_DIR/"
          rsync -az -e "$RSH" .env.example "$DEPLOY_HOST:$DEPLOY_DIR/.env.example"

          echo "==> Sync Flutter web (keep hosted APK under web/app)"
          rsync -az --delete -e "$RSH" --exclude 'app/' \
            frontend/build/web/ "$DEPLOY_HOST:$DEPLOY_DIR/web/"
          rsync -az -e "$RSH" \
            frontend/build/app/outputs/flutter-apk/app-release.apk \
            "$DEPLOY_HOST:$DEPLOY_DIR/web/app/compre-barato-alagoas.apk"

          echo "==> Sync admin dashboard + docs (static)"
          rsync -az --delete -e "$RSH" admin-frontend/ "$DEPLOY_HOST:$DEPLOY_DIR/admin/"
          rsync -az --delete -e "$RSH" docs/ "$DEPLOY_HOST:$DEPLOY_DIR/docs/"

          echo "==> Load the prebuilt API image onto the host (no build, no registry)"
          docker save "$API_IMAGE" | gzip | \
            $SSH "$DEPLOY_HOST" "gunzip | docker load"

          echo "==> Restart stack via remote-update.sh (disk pre-check + health check)"
          $SSH "$DEPLOY_HOST" \
            "API_IMAGE='$API_IMAGE' DEPLOY_DIR='$DEPLOY_DIR' bash '$DEPLOY_DIR/deploy/remote-update.sh'"
