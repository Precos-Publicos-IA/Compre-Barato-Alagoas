# Enforce reviewer-file rules on PRs:
#   * any PR that removes a reviewer is closed
#   * a PR that adds a reviewer is blocked until 2 existing reviewers comment LGTM
#
# pull_request_target + checkout of default branch only (script talks to the API).
name: Reviewers guard

on:
  pull_request_target:
    paths:
      - reviewers
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewers-guard:
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check reviewers diff
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 .github/scripts/reviewers_pr_guard.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "guard exit $rc"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 20 ]; then
            gh pr close "$PR_NUMBER" --comment "$(cat <<'EOF'
          This PR is closed automatically because it **removes a reviewer**.

          Reviewer removal is private — message Viny on Telegram. Do not open a PR that deletes a name from `reviewers`.
          EOF
          )" || true
            exit 1
          fi
          if [ "$rc" -eq 10 ]; then
            echo "Waiting for 2 LGTM comments from existing reviewers."
            exit 1
          fi
          exit 1
