# Flutter static analysis + unit tests on frontend changes (#305, aligns with #300).
# Separate from deploy.yml so PRs get a fast signal without shipping.
name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        # infos (style nits) non-fatal; warnings/errors fail the job.
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test
