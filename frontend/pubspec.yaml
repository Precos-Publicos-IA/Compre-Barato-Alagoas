name: compre_barato_alagoas
description: "Compre Barato Alagoas — compare grocery prices from public SEFAZ-AL data."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # State management (same family as the reference project).
  flutter_riverpod: ^3.0.0
  # Networking.
  http: ^1.2.0
  # Map (OpenStreetMap tiles — no API key required).
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  # Voice input.
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.0
  # Native share sheet (WhatsApp etc.) for the "share your savings" feature.
  share_plus: ^10.1.0
  # Incoming deep links / Android App Links (open the app from a shared link).
  app_links: ^6.3.0
  # Local persistence for recent shopping lists.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates app icons (all Android densities + adaptive + web) from one source.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

# App icon generation. Source logo lives in shared-assets/; the two images here
# are derived from it (white-bg square for legacy/web, padded transparent
# foreground for Android adaptive icons). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon-white.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon-white.png"
    background_color: "#FFFFFF"
    theme_color: "#1B7F3B"
