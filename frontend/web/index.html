<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Stop Safari/iOS from turning prices, CNPJs, and other digit runs into tel: links. -->
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Compare preços de supermercados, farmácias e lojas em Alagoas com dados públicos da SEFAZ-AL.">
  <!-- iPhone Safari / A2HS: correct CSS pixels + safe-area env vars for notch/home indicator.
       viewport-fit=cover lets Flutter SafeArea / MediaQuery.padding work on notched iPhones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- apple-mobile-web-app-capable is still required on some iOS versions for standalone A2HS. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compre Barato Alagoas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Compre Barato Alagoas</title>
  <link rel="manifest" href="manifest.json">

  <!-- Suppress the browser's "install this web app" (PWA) prompt. We steer users
       to the Android APK instead (and, in the future, the Play Store). -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
