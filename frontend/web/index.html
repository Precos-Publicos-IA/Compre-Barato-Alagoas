<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Stop Safari/iOS from turning prices, CNPJs, and other digit runs into tel: links. -->
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Compare preços de supermercados, farmácias e lojas em Alagoas com dados públicos da SEFAZ-AL.">
  <meta name="theme-color" content="#1B7F3B">
  <!-- iPhone Safari / A2HS: correct CSS pixels + safe-area env vars for notch/home indicator.
       viewport-fit=cover lets Flutter SafeArea / MediaQuery.padding work on notched iPhones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS / Safari "Add to Home Screen" (PWA-lite) -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- apple-mobile-web-app-capable is still required on some iOS versions for standalone A2HS. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compre Barato Alagoas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Compre Barato Alagoas</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Critical first-paint styles — avoid blank white on slow cellular (esp. iPhone Safari). */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F6F7F5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1a1a1a;
      -webkit-text-size-adjust: 100%;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F6F7F5;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      box-sizing: border-box;
      text-align: center;
      transition: opacity 0.25s ease;
    }
    #boot-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash .brand-mark {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #1B7F3B;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(27, 127, 59, 0.25);
    }
    #boot-splash .brand-mark img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    #boot-splash h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #1B7F3B;
      line-height: 1.25;
    }
    #boot-splash .tagline {
      margin: 0 0 28px;
      font-size: 0.95rem;
      color: #555;
      max-width: 280px;
      line-height: 1.4;
    }
    #boot-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d4e8da;
      border-top-color: #1B7F3B;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    #boot-splash .status {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #666;
      min-height: 1.4em;
    }
    #boot-splash .error-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 320px;
    }
    #boot-splash.error .spinner,
    #boot-splash.error .status-loading {
      display: none;
    }
    #boot-splash.error .error-box {
      display: flex;
    }
    #boot-splash .error-box p {
      margin: 0;
      font-size: 1rem;
      color: #333;
      line-height: 1.45;
    }
    #boot-splash .reload-btn {
      display: inline-block;
      margin-top: 4px;
      padding: 14px 28px;
      min-height: 48px;
      min-width: 160px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: #1B7F3B;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #boot-splash .reload-btn:active {
      opacity: 0.85;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- On Chromium/Android we suppress the mini-install prompt and point users at
       the APK/Play path in-app. iOS Safari never fires beforeinstallprompt; it
       uses Share → Add to Home Screen instead (see install banner in Flutter). -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
    });
  </script>
</head>
<body>
  <!-- First-paint splash shown until Flutter renders (or load fails / times out). -->
  <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
    <div class="brand-mark" aria-hidden="true">
      <img src="icons/Icon-192.png" alt="" width="48" height="48"
           onerror="this.style.display='none'">
    </div>
    <h1>Compre Barato Alagoas</h1>
    <p class="tagline">Comparando preços perto de você…</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="status status-loading">Carregando…</p>
    <div class="error-box">
      <p>Falha ao carregar. Puxe para atualizar ou toque no botão abaixo.</p>
      <button type="button" class="reload-btn" id="boot-reload">Tentar de novo</button>
    </div>
  </div>

  <noscript>
    <div style="padding:24px;max-width:420px;margin:40px auto;text-align:center;font-family:system-ui,sans-serif">
      <h1 style="color:#1B7F3B">Compre Barato Alagoas</h1>
      <p>Este app precisa de JavaScript para funcionar. Ative o JavaScript nas configurações do navegador e recarregue a página.</p>
    </div>
  </noscript>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var splash = document.getElementById('boot-splash');
      var reloadBtn = document.getElementById('boot-reload');
      var LOAD_TIMEOUT_MS = 45000;
      var dismissed = false;

      function dismissSplash() {
        if (dismissed || !splash) return;
        dismissed = true;
        splash.setAttribute('aria-busy', 'false');
        splash.classList.add('hidden');
        // Remove from DOM after fade so it doesn't intercept taps.
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 300);
      }

      function showError() {
        if (dismissed || !splash) return;
        splash.classList.add('error');
        splash.setAttribute('aria-busy', 'false');
        splash.removeAttribute('role');
      }

      if (reloadBtn) {
        reloadBtn.addEventListener('click', function () {
          window.location.reload();
        });
      }

      // Hide splash once Flutter paints its first frame (flutter_bootstrap sets this).
      window.addEventListener('flutter-first-frame', dismissSplash);

      // Fallback: if the engine never starts (flaky network / blocked assets).
      var timeoutId = setTimeout(function () {
        if (!dismissed) showError();
      }, LOAD_TIMEOUT_MS);

      // Also listen for uncaught script errors during bootstrap (best-effort).
      window.addEventListener('error', function (ev) {
        var src = (ev && ev.filename) || '';
        if (/flutter|main\.dart\.js|canvaskit/i.test(src) && !dismissed) {
          clearTimeout(timeoutId);
          showError();
        }
      });

      // Expose for optional flutter_bootstrap custom config / debugging.
      window._cbaBootSplash = { dismiss: dismissSplash, showError: showError };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
