# Production stack for Compre Barato Alagoas (API + Postgres + Redis).
#
# Config split (never commit real secrets):
#   ../.env                 — non-secret flags, DB password, admin token, etc.
#   ../secrets/sefaz.env    — SEFAZ_APP_TOKEN only (mode 600; CI-managed)
#   ../secrets/sefaz_app_token — raw token file for SEFAZ_APP_TOKEN_FILE (mode 644
#       so non-root appuser can read the bind mount)
#
# Why env_file for the AppToken: the API runs as uid 10001; a mode-600 host
# "Compose secret" mount is unreadable in-container. env_file is read on the host
# by the deploy user and injected into the process environment.
#
# Run: docker compose --env-file ../.env up -d --build
#
# Fronting: host nginx + certbot. API on 127.0.0.1:8000 only.
services:
  api:
    build:
      context: ../backend
    # CI pins a specific tag via API_IMAGE (built in the pipeline and loaded onto
    # the host); a manual `docker compose up --build` falls back to :latest.
    image: ${API_IMAGE:-compre-barato-alagoas-api:latest}
    env_file:
      - ../.env
      - ../secrets/sefaz.env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alagoas}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-alagoas}
      WEB_CONCURRENCY: "2"
      # File fallback (bind mount below). Env SEFAZ_APP_TOKEN from sefaz.env wins
      # when set; file is used if env is empty (see Settings.resolved_sefaz_app_token).
      SEFAZ_APP_TOKEN_FILE: /run/secrets/sefaz_app_token
    volumes:
      - type: bind
        source: ../secrets/sefaz_app_token
        target: /run/secrets/sefaz_app_token
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alagoas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-alagoas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alagoas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
