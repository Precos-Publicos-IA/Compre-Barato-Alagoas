# Production stack for Compre Barato Alagoas (API + Postgres + Redis).
# Non-secret config: single `.env` at the app root (never committed).
# SEFAZ AppToken: host file ../secrets/sefaz_app_token (mode 600), mounted as a
# Compose secret — not stuffed into .env. CI writes that file from the GitHub
# Actions secret SEFAZ_APP_TOKEN (see deploy/sync-sefaz-token.sh).
# Run with: docker compose --env-file ../.env up -d --build
#
# Fronting is handled by an nginx + certbot on the host (see deploy/nginx/).
# The API is published only on localhost; the Flutter web build is served by nginx
# directly from the deployed web/ directory.
services:
  api:
    build:
      context: ../backend
    # CI pins a specific tag via API_IMAGE (built in the pipeline and loaded onto
    # the host); a manual `docker compose up --build` falls back to :latest.
    image: ${API_IMAGE:-compre-barato-alagoas-api:latest}
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alagoas}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-alagoas}
      WEB_CONCURRENCY: "2"
      # Prefer secret file over SEFAZ_APP_TOKEN in .env (leave that empty on VPS).
      SEFAZ_APP_TOKEN_FILE: /run/secrets/sefaz_app_token
    secrets:
      - sefaz_app_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Published on localhost only; the host nginx reverse-proxies to it.
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alagoas}
      # No weak fallback: fail fast if the operator hasn't set a real password (#145).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-alagoas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alagoas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # AOF persistence so shared-list UUIDs survive restarts (30-day TTLs).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    # Gate the API on Redis actually answering, not just the container starting, so
    # the app (Redis is mandatory) doesn't flap on a cold/slow restart (#327).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Host path is relative to this compose file (deploy/). remote-update ensures the
# file exists (empty OK until GitHub secret is set). Never commit real contents.
secrets:
  sefaz_app_token:
    file: ../secrets/sefaz_app_token

volumes:
  pgdata:
  redisdata:
