# Production stack for Compre Barato Alagoas (API + Postgres + Redis).
# Config and secrets live in the single `.env` at the repo root (never committed).
# Run with: docker compose --env-file ../.env up -d --build
#
# Fronting is handled by an nginx + certbot on the host (see deploy/nginx/).
# The API is published only on localhost; the Flutter web build is served by nginx
# directly from the deployed web/ directory.
#
# Resource ceilings (#307): tune via env if the VPS is smaller/larger than defaults.
# Redis uses volatile-ttl so keys with TTL (lists, devices, rate limits, analytics)
# are preferred eviction candidates; keys without TTL are retained until policy allows.
services:
  api:
    build:
      context: ../backend
    # CI pins a specific tag via API_IMAGE (built in the pipeline and loaded onto
    # the host); a manual `docker compose up --build` falls back to :latest.
    image: ${API_IMAGE:-compre-barato-alagoas-api:latest}
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alagoas}:${POSTGRES_PASSWORD:-alagoas}@postgres:5432/${POSTGRES_DB:-alagoas}
      WEB_CONCURRENCY: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-1g}
    cpus: ${API_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Published on localhost only; the host nginx reverse-proxies to it.
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alagoas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alagoas}
      POSTGRES_DB: ${POSTGRES_DB:-alagoas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # App state is Redis-primary; Postgres is auxiliary/RAG — keep modest by default.
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alagoas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # AOF + maxmemory so the container cannot OOM the host under key growth (#307).
    # maxmemory is slightly under mem_limit so Redis can evict before cgroup kill.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-400mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-ttl}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-0.5}

volumes:
  pgdata:
  redisdata:
