# Production stack for Compre Barato Alagoas (API + Postgres + Redis).
# Config and secrets live in the single `.env` at the repo root (never committed).
# Run with: docker compose --env-file ../.env up -d --build
#
# Fronting is handled by an nginx + certbot on the host (see deploy/nginx/).
# The API is published only on localhost; the Flutter web build is served by nginx
# directly from the deployed web/ directory.
#
# Supply-chain posture (#269): prefer immutable tags/digests in production.
# - API: CI should set API_IMAGE=compre-barato-alagoas-api:<git-sha> (never rely on
#   :latest in prod). Optional: pin as image@sha256:… after `docker inspect`.
# - Redis/Postgres: major tags below are the documented baseline; operators may
#   override via compose override file with digest pins after a verified upgrade.
# See deploy/README.md "Image pinning".
services:
  api:
    build:
      context: ../backend
    # CI pins a specific tag via API_IMAGE (built in the pipeline and loaded onto
    # the host); a manual `docker compose up --build` falls back to :latest.
    image: ${API_IMAGE:-compre-barato-alagoas-api:latest}
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alagoas}:${POSTGRES_PASSWORD:-alagoas}@postgres:5432/${POSTGRES_DB:-alagoas}
      WEB_CONCURRENCY: "2"
      # Optional observability / client policy (also read from .env via env_file).
      GIT_SHA: ${GIT_SHA:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Published on localhost only; the host nginx reverse-proxies to it.
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    # Baseline major tag; pin digest in a compose override for strict prod (#269).
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alagoas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alagoas}
      POSTGRES_DB: ${POSTGRES_DB:-alagoas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alagoas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Baseline major tag; pin digest in a compose override for strict prod (#269).
    image: ${REDIS_IMAGE:-redis:7-alpine}
    # AOF persistence so shared-list UUIDs survive restarts (30-day TTLs).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
