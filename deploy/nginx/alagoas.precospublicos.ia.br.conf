# nginx vhost for Compre Barato Alagoas.
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d alagoas.precospublicos.ia.br
# Certbot will add the TLS (443) server block and the HTTP->HTTPS redirect, matching
# the other sites on this host. This file is the pre-TLS (port 80) starting point.
server {
    listen 80;
    listen [::]:80;
    server_name alagoas.precospublicos.ia.br;

    # Flutter web build (served directly by nginx).
    # Must match DEPLOY_DIR/web from deploy.sh.
    root /srv/apps/compre-barato-alagoas/web;
    index index.html;

    # Backend API + docs -> Dockerized FastAPI on localhost.
    location ~ ^/(api|health|docs|redoc|openapi\.json) {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8000;
    }

    # SPA fallback so deep links resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
