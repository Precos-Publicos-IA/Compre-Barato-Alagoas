# nginx vhost for Compre Barato Alagoas.
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d alagoas.precospublicos.ia.br
# Certbot will add the TLS (443) server block and the HTTP->HTTPS redirect, matching
# the other sites on this host. This file is the pre-TLS (port 80) starting point.
server {
    listen 80;
    listen [::]:80;
    server_name alagoas.precospublicos.ia.br;

    # Don't advertise the exact nginx version in the Server header (V-04).
    server_tokens off;

    # HSTS: once certbot turns this into the :443 block, force HTTPS for a year so a
    # first-hit downgrade (SSL stripping) can't happen on return visits (V-06).
    # (Ignored by browsers on plain HTTP; only takes effect over TLS.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Baseline security headers for the HTML app shell (#208). NB: nginx add_header
    # does not inherit into locations that set their own add_header (the /api and
    # /.well-known blocks below) — fine, those aren't frameable HTML.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=()" always;

    # Defense-in-depth: never serve backup/dump/config files even if one is ever
    # dropped into the web root by accident (V-01 hygiene; the app has none today).
    location ~* \.(sql|bak|log|env|sqlite|db|swp|orig|old)$ {
        deny all;
        return 404;
    }

    # Flutter web build (served directly by nginx).
    # Must match DEPLOY_DIR/web from deploy.sh.
    root /srv/apps/compre-barato-alagoas/web;
    index index.html;

    # Android App Links + iOS AASA (+ any other well-known statements).
    # Files live in deploy/well-known/ on the deploy host (rsync deploy/ tree) OR
    # operators copy them beside the web root; alias points at a stable path.
    location ^~ /.well-known/ {
        alias /srv/apps/compre-barato-alagoas/deploy/well-known/;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Backend application API only -> Dockerized FastAPI on localhost.
    # Do NOT proxy /docs, /redoc or /openapi.json on the public app host: in
    # production the FastAPI app disables them (ENVIRONMENT=production), and we
    # avoid advertising an interactive schema explorer at the edge. Product-level
    # endpoint docs live on docs.* (see docs/security-posture.md).
    location ~ ^/(api|health) {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        # Discourage indexing of API/health if a crawler hits them directly (#130).
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Cold SEFAZ (official API fail → website scrape) can exceed nginx's
        # default 60s; match gunicorn --timeout 120 in backend/Dockerfile (#196).
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
    }

    # Hashed build assets must 404 when missing instead of falling through to the
    # SPA fallback below: a stale/incomplete deploy serving 200 text/html for a
    # missing main.dart.js or chunk breaks Flutter boot and cache recovery (#335).
    location ~* \.(js|wasm|css|json|map|png|jpg|jpeg|gif|svg|ico|ttf|otf|woff2?|bin|symbols)$ {
        try_files $uri =404;
    }

    # SPA fallback so deep links (navigation routes, no file extension) resolve to
    # index.html. robots.txt is a real file in the web root (frontend/web/robots.txt).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
