# nginx vhost for Compre Barato Alagoas.
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d alagoas.precospublicos.ia.br
# Certbot will add the TLS (443) server block and the HTTP->HTTPS redirect, matching
# the other sites on this host. This file is the pre-TLS (port 80) starting point.
#
# One-time http-context include (zones + log_format) — required for limit_req (#360):
#   sudo cp deploy/nginx/snippets/http-zones.conf /etc/nginx/conf.d/compre-barato-zones.conf
#
# Snippet paths below assume this repo is deployed to DEPLOY_DIR; adjust if you copy
# only sites-available files without the deploy/ tree.
server {
    listen 80;
    listen [::]:80;
    server_name alagoas.precospublicos.ia.br;

    # Don't advertise the exact nginx version in the Server header (V-04).
    server_tokens off;

    # Correlated access logs (#363). Falls back to default if log_format not loaded.
    access_log /var/log/nginx/alagoas.access.log compre_barato_ext;

    # HSTS: once certbot turns this into the :443 block, force HTTPS for a year so a
    # first-hit downgrade (SSL stripping) can't happen on return visits (V-06).
    # (Ignored by browsers on plain HTTP; only takes effect over TLS.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /srv/apps/compre-barato-alagoas/deploy/nginx/snippets/security-headers.conf;

    # Defense-in-depth: never serve backup/dump/config files even if one is ever
    # dropped into the web root by accident (V-01 hygiene; the app has none today).
    location ~* \.(sql|bak|log|env|sqlite|db|swp|orig|old)$ {
        deny all;
        return 404;
    }

    # Flutter web build (served directly by nginx).
    # Must match DEPLOY_DIR/web from deploy.sh.
    root /srv/apps/compre-barato-alagoas/web;
    index index.html;

    # Android App Links + iOS AASA (+ any other well-known statements).
    # Files live in deploy/well-known/ on the deploy host (rsync deploy/ tree) OR
    # operators copy them beside the web root; alias points at a stable path.
    location ^~ /.well-known/ {
        alias /srv/apps/compre-barato-alagoas/deploy/well-known/;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Hashed Flutter/Canvaskit assets: long cache; real 404 (not SPA HTML) if missing (#106, #335, #350).
    location ~* ^/(assets|canvaskit|icons)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location ~* \.(?:js|css|wasm|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Shell must revalidate so deploys pick up new asset hashes (#350).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Backend application API only -> Dockerized FastAPI on localhost.
    # Do NOT proxy /docs, /redoc or /openapi.json on the public app host: in
    # production the FastAPI app disables them (ENVIRONMENT=production), and we
    # avoid advertising an interactive schema explorer at the edge. Product-level
    # endpoint docs live on docs.* (see docs/seguranca-postura.md).
    location ~ ^/(api|health) {
        # Edge rate limit (#360). Requires http-zones.conf installed; comment out if missing.
        limit_req zone=cba_app_api burst=40 nodelay;
        limit_req_status 429;
        include /srv/apps/compre-barato-alagoas/deploy/nginx/snippets/proxy-api.conf;
        # Discourage indexing of API/health if a crawler hits them directly (#130).
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8000;
    }

    # SPA fallback so deep links resolve to index.html.
    # robots.txt is a real file in the web root (frontend/web/robots.txt).
    location / {
        limit_conn cba_conn 20;
        try_files $uri $uri/ /index.html;
    }
}
