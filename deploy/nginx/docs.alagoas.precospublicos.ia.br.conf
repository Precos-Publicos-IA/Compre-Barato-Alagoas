# nginx vhost for the Compre Barato Alagoas documentation site.
# Static only (no API): plain HTML/CSS, no build step — same ethos as admin-frontend.
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d docs.alagoas.precospublicos.ia.br
# Certbot adds the TLS (443) server block and HTTP->HTTPS redirect. Point the
# docs.* DNS A-record at this host first. This file is the pre-TLS (port 80) start.
#
# Requires http-zones.conf in conf.d for limit_conn (optional on docs-only hosts).
server {
    listen 80;
    listen [::]:80;
    server_name docs.alagoas.precospublicos.ia.br;

    # Don't advertise the exact nginx version in the Server header (V-04).
    server_tokens off;

    access_log /var/log/nginx/docs.alagoas.access.log compre_barato_ext;

    # HSTS once certbot promotes this to the :443 block (V-06).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /srv/apps/compre-barato-alagoas/deploy/nginx/snippets/security-headers.conf;

    # Defense-in-depth: never serve backup/dump/config files (V-01 hygiene).
    location ~* \.(sql|bak|log|env|sqlite|db|swp|orig|old)$ {
        deny all;
        return 404;
    }

    # Static documentation site (served directly by nginx).
    # Must match DEPLOY_DIR/docs from deploy.sh.
    root /srv/apps/compre-barato-alagoas/docs;
    index index.html;

    location / {
        limit_conn cba_conn 30;
        try_files $uri $uri/ =404;
    }
}
