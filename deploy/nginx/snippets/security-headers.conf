# Common security headers for Compre Barato Alagoas vhosts (#352, #155, #75 area).
# Include inside server {} blocks. Does not replace CSP tuning for Flutter canvas.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Product uses geolocation + microphone (voice list); deny other powerful features by default.
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(), usb=(), interest-cohort=()" always;
