# Include once from http {} (e.g. /etc/nginx/conf.d/compre-barato-zones.conf).
# Certbot/vhost files in sites-enabled cannot define limit_req_zone themselves.
#
# Addresses #360 (edge rate limits) and supports #363 (shared log format).
# Operator: sudo cp deploy/nginx/snippets/http-zones.conf /etc/nginx/conf.d/compre-barato-zones.conf
#           sudo nginx -t && sudo systemctl reload nginx

# --- Access log format with request id correlation (#363) ---
# $request_id is set by nginx (or pass through client X-Request-ID via map if desired).
log_format compre_barato_ext '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" '
    'urt="$upstream_response_time" rid="$request_id" '
    'xff="$http_x_forwarded_for"';

# --- Rate-limit zones (#360) — keyed by real client IP (not spoofable XFF at edge) ---
# App API/health: generous enough for normal SPA + retries; burst absorbs spikes.
limit_req_zone $binary_remote_addr zone=cba_app_api:10m rate=15r/s;
# Admin API: stricter (static token surface; complements #163 app-layer lockout work).
limit_req_zone $binary_remote_addr zone=cba_admin_api:10m rate=5r/s;
# Static / SPA / docs: connection-oriented abuse resistance.
limit_conn_zone $binary_remote_addr zone=cba_conn:10m;
