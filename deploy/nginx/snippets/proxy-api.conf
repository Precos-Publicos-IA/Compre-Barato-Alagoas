# Shared reverse-proxy settings for FastAPI on 127.0.0.1:8000 (#168, #361, #196).
# Include inside location blocks that proxy to the API.
proxy_http_version 1.1;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Host $http_host;
# Propagate nginx request id so edge access logs (#363) align with API/Sentry (#136).
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
# Long enough for SEFAZ/LLM search; align gunicorn worker timeout on the host (#196).
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering on;
client_max_body_size 1m;
