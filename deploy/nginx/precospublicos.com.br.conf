# Redirect-only vhost: precospublicos.com.br (+ www) -> Preços Públicos IA LinkedIn.
# No content is served here; the apex domain is just a marketing redirect.
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d precospublicos.com.br -d www.precospublicos.com.br
# Point the precospublicos.com.br DNS A-record at this host FIRST (certbot HTTP-01
# needs it to resolve here). certbot adds the :443 block + the http->https redirect.
# The acme-challenge location stays reachable (location-scoped redirect, not a
# server-level return) so cert issuance/renewal is never redirected away.
server {
    listen 80;
    listen [::]:80;
    server_name precospublicos.com.br www.precospublicos.com.br;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        return 301 https://www.linkedin.com/company/pre%C3%A7os-publicos-ia/;
    }
}
