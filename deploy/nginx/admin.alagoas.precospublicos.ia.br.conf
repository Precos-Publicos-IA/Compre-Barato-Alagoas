# nginx vhost for the Compre Barato Alagoas admin dashboard.
# Separate static frontend from the user app; same backend (FastAPI on :8000).
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d admin.alagoas.precospublicos.ia.br
# Certbot adds the TLS (443) server block and HTTP->HTTPS redirect. Point the
# admin.* DNS A-record at this host first. This file is the pre-TLS (port 80) start.
server {
    listen 80;
    listen [::]:80;
    server_name admin.alagoas.precospublicos.ia.br;

    # Static admin SPA (served directly by nginx).
    # Must match DEPLOY_DIR/admin from deploy.sh.
    root /srv/apps/compre-barato-alagoas/admin;
    index index.html;

    # Optional belt-and-suspenders gate (the app already requires ADMIN_TOKEN):
    #   auth_basic "Admin";
    #   auth_basic_user_file /etc/nginx/.htpasswd-alagoas-admin;

    # Admin API -> Dockerized FastAPI on localhost. Same-origin as the SPA, so no CORS.
    location /admin/api/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8000;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
