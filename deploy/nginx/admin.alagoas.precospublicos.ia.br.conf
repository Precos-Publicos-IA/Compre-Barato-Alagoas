# nginx vhost for the Compre Barato Alagoas admin dashboard.
# Separate static frontend from the user app; same backend (FastAPI on :8000).
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then run:
#   sudo certbot --nginx -d admin.alagoas.precospublicos.ia.br
# Certbot adds the TLS (443) server block and HTTP->HTTPS redirect. Point the
# admin.* DNS A-record at this host first. This file is the pre-TLS (port 80) start.
#
# Requires http-zones.conf in conf.d (see deploy/nginx/snippets/http-zones.conf).
server {
    listen 80;
    listen [::]:80;
    server_name admin.alagoas.precospublicos.ia.br;

    # Don't advertise the exact nginx version in the Server header (V-04).
    server_tokens off;

    access_log /var/log/nginx/admin.alagoas.access.log compre_barato_ext;

    # HSTS once certbot promotes this to the :443 block (V-06).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /srv/apps/compre-barato-alagoas/deploy/nginx/snippets/security-headers.conf;
    # Admin SPA: discourage indexing even for non-HTML probes (#326).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Defense-in-depth: never serve backup/dump/config files (V-01 hygiene).
    location ~* \.(sql|bak|log|env|sqlite|db|swp|orig|old)$ {
        deny all;
        return 404;
    }

    # Static admin SPA (served directly by nginx).
    # Must match DEPLOY_DIR/admin from deploy.sh.
    root /srv/apps/compre-barato-alagoas/admin;
    index index.html;

    # Optional belt-and-suspenders gate (the app already requires ADMIN_TOKEN):
    #   auth_basic "Admin";
    #   auth_basic_user_file /etc/nginx/.htpasswd-alagoas-admin;

    # Admin API -> Dockerized FastAPI on localhost. Same-origin as the SPA, so no CORS.
    location /admin/api/ {
        # Stricter edge throttle than public app API (#360, #361).
        limit_req zone=cba_admin_api burst=20 nodelay;
        limit_req_status 429;
        include /srv/apps/compre-barato-alagoas/deploy/nginx/snippets/proxy-api.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    # SPA fallback.
    location / {
        limit_conn cba_conn 10;
        try_files $uri $uri/ /index.html;
    }
}
